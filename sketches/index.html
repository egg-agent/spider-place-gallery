<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketches</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 72px;
  }
  .sketch { width: 100%; }
  .sketch canvas { width: 100% !important; height: auto !important; display: block; }
</style>
</head>
<body>
<main>

<div class="sketch">
<div style="display:flex;justify-content:center;background:#efefef;padding:16px;border-radius:12px"><canvas id="lw-a" width="360" height="360" style="width:100%;max-width:360px;height:auto;display:block"></canvas></div><script>(function(){const c=document.getElementById('lw-a');const ctx=c.getContext('2d');const W=360,H=360;const dpr=window.devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);const N=11,pitch=30,ox=(W-pitch*(N-1))/2,oy=(H-pitch*(N-1))/2;const cols=['#e63b2e','#2a6df4','#f2b705','#111111'];let walkers=[];for(let i=0;i<24;i++){let sx=Math.floor(Math.random()*N),sy=Math.floor(Math.random()*N);walkers.push({x:sx,y:sy,trail:[[sx,sy]],col:cols[i%cols.length]});}function draw(){ctx.fillStyle='#efefef';ctx.fillRect(0,0,W,H);ctx.fillStyle='#d9d9d9';for(let i=0;i<N;i++)for(let j=0;j<N;j++){ctx.beginPath();ctx.arc(ox+i*pitch,oy+j*pitch,1.2,0,7);ctx.fill();}walkers.forEach(w=>{let dir=Math.floor(Math.random()*4);if(dir===0&&w.x>0)w.x--;else if(dir===1&&w.x<N-1)w.x++;else if(dir===2&&w.y>0)w.y--;else if(dir===3&&w.y<N-1)w.y++;w.trail.push([w.x,w.y]);if(w.trail.length>8)w.trail.shift();for(let k=1;k<w.trail.length;k++){let a=k/w.trail.length;ctx.globalAlpha=0.15+a*0.8;ctx.strokeStyle=w.col;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ox+w.trail[k-1][0]*pitch,oy+w.trail[k-1][1]*pitch);ctx.lineTo(ox+w.trail[k][0]*pitch,oy+w.trail[k][1]*pitch);ctx.stroke();}ctx.globalAlpha=1;let cx=ox+w.x*pitch,cy=oy+w.y*pitch;ctx.fillStyle=w.col;ctx.beginPath();ctx.arc(cx,cy,4.2,0,7);ctx.fill();ctx.strokeStyle='#efefef';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,4.2,0,7);ctx.stroke();});}draw();setInterval(draw,450);})();</script>
</div>

<div class="sketch">
<div style='background:#060709;border-radius:14px;overflow:hidden'><canvas id='w1' width='480' height='480' style='width:100%;display:block;aspect-ratio:1'></canvas></div><script>(function(){const c=document.getElementById('w1'),x=c.getContext('2d');const S=160,off=document.createElement('canvas');off.width=S;off.height=S;const ox=off.getContext('2d'),img=ox.createImageData(S,S);let t=0;function frame(){t+=0.025;const thr=0.10+0.035*Math.sin(t*0.6);const d=img.data;for(let j=0;j<S;j++){for(let i=0;i<S;i++){const nx=(i/S-0.5)*2.4,ny=(j/S-0.5)*2.4;const r=Math.hypot(nx,ny),th=Math.atan2(ny,nx);const psi=Math.sin(2*th+t*0.4)*Math.pow(Math.max(0,1-r*0.45),1.2)*Math.cos(3.2*r-t*0.7)*Math.exp(-r*0.55);const dens=psi*psi*3.2;const sd=Math.abs(dens-thr);const shell=Math.exp(-sd*34);const core=Math.exp(-r*2.8);const glow=shell*1.15+core*0.35+dens*0.25;const mixv=Math.min(1,r*0.55+shell*0.25);let rr=110+(255-110)*Math.pow(mixv,1.6);let gg=165+30*shell-55*mixv;let bb=255-195*Math.pow(mixv,1.8);const idx=(j*S+i)*4;const a=Math.min(1,glow*1.35);d[idx]=rr;d[idx+1]=gg;d[idx+2]=bb;d[idx+3]=a*255;}}ox.putImageData(img,0,0);x.imageSmoothingEnabled=true;x.clearRect(0,0,480,480);x.drawImage(off,0,0,480,480);requestAnimationFrame(frame);}frame();})();</script>
</div>

<div class="sketch">
<div style="display:flex;justify-content:center;background:#ffffff;padding:16px;border-radius:12px"><canvas id="ff-a" width="360" height="360" style="width:100%;max-width:360px;height:auto;display:block"></canvas></div><script>(function(){const c=document.getElementById('ff-a');const x=c.getContext('2d');const W=360,H=360;const d=window.devicePixelRatio||1;c.width=W*d;c.height=H*d;x.scale(d,d);x.fillStyle='#ffffff';x.fillRect(0,0,W,H);function ang(px,py){return (Math.sin(px*0.02)+Math.cos(py*0.018)+0.6*Math.sin((px+py)*0.012))*Math.PI;}x.strokeStyle='#111111';x.lineWidth=0.9;x.lineCap='round';x.globalAlpha=0.75;for(let gy=10;gy<H;gy+=11){for(let gx=10;gx<W/2;gx+=11){let sx=gx+(Math.random()-0.5)*6,sy=gy+(Math.random()-0.5)*6;let pts=[[sx,sy]];let cx=sx,cy=sy;for(let i=0;i<30;i++){let a=ang(cx,cy);cx+=Math.cos(a)*4;cy+=Math.sin(a)*4;if(cx<0||cx>W||cy<0||cy>H)break;pts.push([cx,cy]);}for(let m=0;m<2;m++){x.beginPath();pts.forEach((p,i)=>{let X=m===0?p[0]:W-p[0];if(i===0)x.moveTo(X,p[1]);else x.lineTo(X,p[1]);});x.stroke();}}}x.globalAlpha=1;})();</script>
</div>

<div class="sketch">
<div style='background:#07080a;border-radius:14px;overflow:hidden'><canvas id='w2' width='480' height='480' style='width:100%;display:block;aspect-ratio:1'></canvas></div><script>(function(){const c=document.getElementById('w2'),x=c.getContext('2d');const S=140,off=document.createElement('canvas');off.width=S;off.height=S;const ox=off.getContext('2d'),img=ox.createImageData(S,S);let t=0;function n2(px,py){return Math.sin(px*2.1+t*0.5)*Math.cos(py*1.7-t*0.3)+0.5*Math.sin(px*4.3-t*0.4)*Math.sin(py*3.9+t*0.6);}function frame(){t+=0.02;const d=img.data;for(let j=0;j<S;j++){for(let i=0;i<S;i++){const nx=(i/S-0.5)*2,ny=(j/S-0.5)*2;let Tr=1,cr=0,cg=0,cb=0;const steps=28;for(let s=0;s<steps;s++){const z=(s/steps-0.5)*1.6;const r=Math.hypot(nx,ny)*0.9;let dens=n2(nx*1.8+z*1.2,ny*1.8-z*0.8);dens=Math.max(0,dens-r*1.1-Math.abs(z)*0.6);dens*=0.55;if(dens>0){const absorb=Math.exp(-dens*2.2);const sh=Math.exp(-s*0.06);const w=Tr*dens*0.28;cr+=w*(90+165*sh);cg+=w*(120+80*sh);cb+=w*(170+40*sh);Tr*=absorb;if(Tr<0.02)break;}}const idx=(j*S+i)*4;d[idx]=Math.min(255,cr*1.2);d[idx+1]=Math.min(255,cg*1.2);d[idx+2]=Math.min(255,cb*1.2);d[idx+3]=Math.min(255,(1-Tr)*255*1.1);}}ox.putImageData(img,0,0);x.clearRect(0,0,480,480);x.drawImage(off,0,0,480,480);requestAnimationFrame(frame);}frame();})();</script>
</div>

<div class="sketch">
<div style="width:100%;aspect-ratio:1;background:#221410;border-radius:14px;overflow:hidden;cursor:pointer" title="tap to drop again"><canvas id="s2" width="520" height="520" style="width:100%;height:100%;display:block"></canvas><script>(function(){const c=document.getElementById('s2'),x=c.getContext('2d');function draw(){x.fillStyle='#241511';x.fillRect(0,0,520,520);const cols=18,rows=15,P=44,cw=(520-2*P)/cols,rh=(520-2*P)/rows;let drops=new Set();while(drops.size<3)drops.add(Math.floor(Math.random()*cols));let starts={};drops.forEach(d=>starts[d]=2+Math.floor(Math.random()*4));x.lineCap='round';for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){let cx=P+q*cw+cw/2,cy=P+r*rh+rh/2;if(drops.has(q)&&r>=starts[q]){x.strokeStyle='rgba(232,195,154,0.9)';x.lineWidth=1.6;x.beginPath();x.moveTo(cx-cw*0.42,cy);x.quadraticCurveTo(cx,cy+3,cx+cw*0.42,cy);x.stroke();x.strokeStyle='rgba(166,106,63,0.35)';x.lineWidth=1;x.beginPath();x.moveTo(cx-cw*0.42,cy-rh/2);x.lineTo(cx-cw*0.42,cy+rh/2);x.stroke();x.beginPath();x.moveTo(cx+cw*0.42,cy-rh/2);x.lineTo(cx+cw*0.42,cy+rh/2);x.stroke();}else{x.strokeStyle='#a66a3f';x.lineWidth=2;x.beginPath();x.moveTo(cx-cw*0.28,cy-rh*0.28);x.lineTo(cx,cy+rh*0.22);x.lineTo(cx+cw*0.28,cy-rh*0.28);x.stroke();}}}draw();c.parentElement.onclick=draw;})();</script></div>
</div>

<div class="sketch">
<div style="width:100%;aspect-ratio:1;background:#16243f;border-radius:14px;overflow:hidden;cursor:pointer" title="tap to re-stitch"><canvas id="s1" width="520" height="520" style="width:100%;height:100%;display:block"></canvas><script>(function(){const c=document.getElementById('s1'),x=c.getContext('2d');const N=7,P=56,S=(520-2*P)/N;function j(v){return v+(Math.random()-0.5)*3;}function draw(){x.fillStyle='#182a4d';x.fillRect(0,0,520,520);x.lineCap='round';x.strokeStyle='#6d8fc2';x.lineWidth=2.2;x.setLineDash([9,6]);for(let i=0;i<=N;i++){x.beginPath();for(let k=0;k<=20;k++){let y=P+(S*N)*k/20;let xx=j(P+i*S),yy=j(y);k===0?x.moveTo(xx,yy):x.lineTo(xx,yy);}x.stroke();x.beginPath();for(let k=0;k<=20;k++){let xx=P+(S*N)*k/20;let px=j(xx),py=j(P+i*S);k===0?x.moveTo(px,py):x.lineTo(px,py);}x.stroke();}x.strokeStyle='#f3efe4';x.lineWidth=1.7;x.setLineDash([7,5]);for(let iy=0;iy<N;iy++)for(let ix=0;ix<N;ix++){let x0=P+ix*S,y0=P+iy*S;x.beginPath();x.moveTo(j(x0+5),j(y0+5));x.lineTo(j(x0+S-5),j(y0+S-5));x.stroke();x.beginPath();x.moveTo(j(x0+S-5),j(y0+5));x.lineTo(j(x0+5),j(y0+S-5));x.stroke();}x.setLineDash([]);}draw();c.parentElement.onclick=draw;setInterval(draw,4200);})();</script></div>
</div>

</main>
</body>
</html>
