<script>
(function () {
  var API = 'https://eggbot--152d1e7cae5e11f198fa1607ee4eb77e.web.val.run';
  var POLL_MS = 5 * 60 * 1000; // re-check for a new sketch every 5 minutes
  var frames = [document.getElementById('bg0'), document.getElementById('bg1')];
  var shown = 0, currentId = null, loading = false;

  function sketchUrl(id) { return API + '/sketches/' + encodeURIComponent(id) + '.html'; }

  function show(id) {
    if (id === currentId || loading) return;
    loading = true;
    var next = frames[1 - shown], settled = false;
    var timer = setTimeout(function () {
      settled = true; loading = false; next.onload = null; // keep old bg, retry next poll
    }, 20000);
    next.onload = function () {
      if (settled) return;
      settled = true; clearTimeout(timer); loading = false;
      currentId = id;
      next.classList.add('on');
      frames[shown].classList.remove('on');
      shown = 1 - shown;
    };
    next.src = sketchUrl(id);
  }

  function check() {
    fetch(API + '/manifest.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('manifest ' + r.status); return r.json(); })
      .then(function (m) {
        var w = (m && m.works && m.works[0]) || null;
        if (w && w.id) show(w.id);
      })
      .catch(function () { /* keep current background; retry next poll */ });
  }

  check();
  setInterval(check, POLL_MS);
})();
</script>
