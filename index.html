<script type="module">
import * as THREE from 'three';

// ---------- config ----------
const ROPES = 2;          // woven ropes (alternating over/under)
const TUBES = 6;          // thin tubes per rope — the cable bundle
const TWIST_TURNS = 5;    // helical winding of thin tubes around each rope, per loop
const SEGS = 360;         // centerline samples per rope
const RADIAL = 10;        // verts around each thin tube
const R_SQ = 2.25;        // rounded-square radius
const SQ_P = 0.6;         // superellipse roundness (2/n)
const WEAVE_M = 4;        // weave lobes -> 8 crossings around the square
const WEAVE_A = 0.30;     // radial weave amplitude
const WEAVE_W = 0.32;     // z weave amplitude (over/under clearance)
const BUNDLE_R = 0.16;    // thin-tube center ring radius
const TUBE_R = 0.105;     // thin tube radius — inflated, puffy
const PUFF_A = 0.10;      // soft-body puff amplitude (fraction of radius)
const PUFF_N = 24;        // puff lobes per loop (integer -> seamless)
const LOOP_S = 7.74;      // reference video loop length
const WEAVE_CYCLES = 2;   // weave-pattern rotations per loop (seamless)

let renderer;
try {
  // perf: final image is a half-res bokeh composite, so canvas MSAA is dead weight
  renderer = new THREE.WebGLRenderer({ antialias: false });
} catch (e) {
  document.getElementById('fail').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ecdf5);

// programmatic sky: gradient + sun + fbm clouds, all in-shader.
// uCloud drives cloud softness/coverage (the "sky blur" slider).
const skyUniforms = {
  uCloud: { value: 0.5 },
  uSunDir: { value: new THREE.Vector3(-0.45, 0.55, -0.7).normalize() },
  uTime: { value: 0 },
  uZen: { value: new THREE.Color(0x1a4dae) },
  uMid: { value: new THREE.Color(0x5c99e6) },
  uHor: { value: new THREE.Color(0xc7e0f7) },
  uSunColor: { value: new THREE.Color(0xfff2d9) },
  uCloudTint: { value: new THREE.Color(0xffffff) },
  uStarAmt: { value: 0 },
  uNebulaAmt: { value: 0 },
};
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(40, 48, 32),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform float uCloud;
      uniform vec3 uSunDir;
      uniform float uTime;
      uniform vec3 uZen;
      uniform vec3 uMid;
      uniform vec3 uHor;
      uniform vec3 uSunColor;
      uniform vec3 uCloudTint;
      uniform float uStarAmt;
      uniform float uNebulaAmt;
      float hash13(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }
      float vnoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x),
              mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
          mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
              mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) {
        float s = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
        return s;
      }
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col;
        if (h >= 0.0) {
          col = mix(uHor, uMid, smoothstep(0.0, 0.35, h));
          col = mix(col, uZen, smoothstep(0.3, 0.85, h));
        } else {
          col = mix(uHor, uHor * 0.55, smoothstep(0.0, -0.4, h));
        }
        vec3 sunDirN = normalize(uSunDir);
        float s = max(dot(d, sunDirN), 0.0);
        col += uSunColor * (pow(s, 600.0) * 1.5 + pow(s, 10.0) * 0.22);
        if (uStarAmt > 0.001 && d.y > 0.02) {
          vec2 sp = d.xz / (d.y + 0.35) * 60.0;
          vec2 cell = floor(sp);
          float sh = hash13(vec3(cell, 7.0));
          if (sh > 0.93) {
            vec2 cpos = vec2(hash13(vec3(cell, 3.0)), hash13(vec3(cell, 13.0))) - 0.5;
            float dd = length(fract(sp) - 0.5 - cpos * 0.7);
            float tw = 0.55 + 0.45 * sin(uTime * (1.5 + sh * 3.0) + sh * 40.0);
            col += vec3(0.85, 0.9, 1.0) * smoothstep(0.10, 0.0, dd) * tw * uStarAmt * smoothstep(0.02, 0.35, d.y);
          }
        }
        if (uNebulaAmt > 0.001) {
          vec2 np = d.xz / (abs(d.y) + 0.45) * 1.4 + 3.7;
          float neb = fbm(vec3(np, 3.7));
          vec3 nebCol = mix(vec3(0.4, 0.16, 0.55), vec3(0.08, 0.35, 0.5), fbm(vec3(np * 1.7 + 11.0, 9.1)));
          col += nebCol * smoothstep(0.42, 0.85, neb) * uNebulaAmt * 0.55 * smoothstep(-0.1, 0.4, d.y);
        }
        if (d.y > 0.015) {
          vec2 cuv = d.xz / (d.y + 0.18);
          float f = fbm(vec3(cuv * 1.4, 3.7)) * 0.72 + fbm(vec3(cuv * 2.8 + 5.0, 9.1)) * 0.28;
          float cover = mix(0.52, 0.72, uCloud);
          float soft = mix(0.07, 0.5, uCloud);
          float cl = smoothstep(cover - soft, cover + soft, f);
          float shade = smoothstep(cover - soft, cover + soft + 0.25, f);
          vec3 cloudCol = mix(uCloudTint * 0.72, uCloudTint * 1.04, shade);
          cloudCol += uSunColor * pow(s, 6.0) * 0.35 * cl;
          cl *= smoothstep(0.015, 0.22, d.y);
          col = mix(col, cloudCol, cl * 0.92);
        }
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
scene.add(skyDome);
function setSkyBlur(px) {
  skyUniforms.uCloud.value = Math.min(Math.max(px / 40, 0), 1);
}
setSkyBlur(20);
// environment is baked from the shader sky inside setSky() (defined below),
// so reflections and ambient light always match the chosen skybox.

const hemiLight = new THREE.HemisphereLight(0xbdd8ff, 0x8a97a8, 0.45);
scene.add(hemiLight);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 8.2);
camera.lookAt(0, 0, 0);
function fitCamera() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.z = camera.aspect >= 1.05 ? 8.2 : 8.2 * (1.05 / camera.aspect);
  camera.updateProjectionMatrix();
}
fitCamera();

// ---- light: dim studio so the emissive stripes do the talking
scene.add(new THREE.AmbientLight(0x30303a, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(3, 5, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x99aaff, 0.9);
rim.position.set(-5, -1, -4);
scene.add(rim);

// ---- skyboxes: full programmatic sky moods. each one retunes the shader
// gradient, sun/moon, clouds, stars, nebula, plus the lights and fog so the
// whole scene sits inside the mood. env reflections are re-baked per skybox.
const SKYBOXES = {
  day:    { zen: 0x1a4dae, mid: 0x5c99e6, hor: 0xc7e0f7, sunColor: 0xfff2d9, sunElev: 38, cloud: 0xffffff, stars: 0,    nebula: 0,    hemiSky: 0xbdd8ff, hemiGround: 0x8a97a8, hemiInt: 0.45, keyColor: 0xffffff, keyInt: 0.85, fog: 0xcfe0f5 },
  golden: { zen: 0x5a5a8e, mid: 0xb46a8a, hor: 0xffc37a, sunColor: 0xffb347, sunElev: 9,  cloud: 0xffd9b8, stars: 0,    nebula: 0,    hemiSky: 0xffd9b0, hemiGround: 0x5a4a6a, hemiInt: 0.5,  keyColor: 0xffc37a, keyInt: 1.1,  fog: 0xf2c49a },
  dawn:   { zen: 0x8d7fb8, mid: 0xb48ab4, hor: 0xffd9c4, sunColor: 0xffe0b0, sunElev: 5,  cloud: 0xffcfe0, stars: 0.04, nebula: 0,    hemiSky: 0xffe4d0, hemiGround: 0x6a6a8a, hemiInt: 0.5,  keyColor: 0xffe0b0, keyInt: 1.0,  fog: 0xf7d9c9 },
  dusk:   { zen: 0x3f2f56, mid: 0x4a2a5a, hor: 0xf4703a, sunColor: 0xff5a2a, sunElev: 2,  cloud: 0x9a5a7a, stars: 0.22, nebula: 0.05, hemiSky: 0xc46a8a, hemiGround: 0x2a2a4a, hemiInt: 0.35, keyColor: 0xff7a3a, keyInt: 0.9,  fog: 0x9a5a6a },
  night:  { zen: 0x01020a, mid: 0x060a1c, hor: 0x0e1830, sunColor: 0xdfe8ff, sunElev: 32, cloud: 0x2a3a5f, stars: 1.0,  nebula: 0.12, hemiSky: 0x2a3a5a, hemiGround: 0x0a0d18, hemiInt: 0.28, keyColor: 0xaac4ff, keyInt: 0.5,  fog: 0x0a1020 },
  space:  { zen: 0x000003, mid: 0x020208, hor: 0x060612, sunColor: 0x444455, sunElev: 20, cloud: 0x111122, stars: 1.0,  nebula: 0.6,  hemiSky: 0x1a1a2a, hemiGround: 0x050508, hemiInt: 0.22, keyColor: 0x8888aa, keyInt: 0.4,  fog: 0x050508 },
  fog:    { zen: 0x8a9098, mid: 0xa8adb4, hor: 0xd4d8dd, sunColor: 0xf0f0f0, sunElev: 30, cloud: 0xc4c9cf, stars: 0,    nebula: 0,    hemiSky: 0xd0d4d8, hemiGround: 0x8a8f94, hemiInt: 0.65, keyColor: 0xe8e8e8, keyInt: 0.7,  fog: 0xc9ced4 },
  forest: { zen: 0x0e2a1c, mid: 0x2a5a34, hor: 0x9ab87a, sunColor: 0xfff2c4, sunElev: 48, cloud: 0x7aaa62, stars: 0,    nebula: 0,    hemiSky: 0xb8d89a, hemiGround: 0x1a2a1a, hemiInt: 0.5,  keyColor: 0xfff2c4, keyInt: 1.0,  fog: 0x9ab87a },
};
let currentSky = 'day';
let hemiBase = 0.45;
let envRT = null;
function refreshEnv() {
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  es.add(new THREE.Mesh(skyDome.geometry, skyDome.material));
  const rt = pm.fromScene(es, 0.35);
  if (envRT) envRT.dispose();
  envRT = rt;
  scene.environment = rt.texture;
  pm.dispose();
}
function setSky(name) {
  currentSky = name;
  const p = SKYBOXES[name];
  skyUniforms.uZen.value.set(p.zen);
  skyUniforms.uMid.value.set(p.mid);
  skyUniforms.uHor.value.set(p.hor);
  skyUniforms.uSunColor.value.set(p.sunColor);
  const el = p.sunElev * Math.PI / 180;
  const sd = new THREE.Vector3(-0.45, Math.tan(el) * 0.83, -0.7).normalize();
  skyUniforms.uSunDir.value.copy(sd);
  skyUniforms.uCloudTint.value.set(p.cloud);
  skyUniforms.uStarAmt.value = p.stars;
  skyUniforms.uNebulaAmt.value = p.nebula;
  hemiBase = p.hemiInt;
  hemiLight.color.set(p.hemiSky);
  hemiLight.groundColor.set(p.hemiGround);
  key.position.copy(sd).multiplyScalar(8);
  key.color.set(p.keyColor);
  key.intensity = p.keyInt;
  if (scene.fog) scene.fog.color.set(p.fog);
  scene.background.set(p.hor);
  refreshEnv();
}
setSky('day');

// ---- stripe texture: dark tube, many thin WHITE stripes running along it
// (TubeGeometry-style uv: u along length, v around -> bands across canvas-y)
function makeStripeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0b0d';
  g.fillRect(0, 0, 64, 1024);
  const bands = 20;
  const h = 1024 / bands;
  for (let i = 0; i < bands; i++) {
    const y = i * h;
    // thin crisp white pinstripe, mostly dark tube between lines
    const grad = g.createLinearGradient(0, y, 0, y + h);
    grad.addColorStop(0.00, 'rgba(255,255,255,0)');
    grad.addColorStop(0.36, 'rgba(255,255,255,0)');
    grad.addColorStop(0.44, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.50, 'rgba(255,255,255,1)');
    grad.addColorStop(0.56, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.64, 'rgba(255,255,255,0)');
    grad.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, y, 64, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const stripeTex = makeStripeTexture();
// liquid glass: clear tubes, frosted pinstripes (roughness), etched bump,
// thin-film sheen, blue-ish attenuation like real glass
const tubeMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.42,
  roughnessMap: stripeTex,
  bumpMap: stripeTex,
  bumpScale: 0.02,
  transmission: 1.0,
  thickness: 0.45,
  ior: 1.52,
  attenuationColor: new THREE.Color(0xcfe4ff),
  attenuationDistance: 2.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  iridescence: 0.28,
  iridescenceIOR: 1.32,
  envMapIntensity: 1.15,
  specularIntensity: 1.0,
});
// emissive braid strands: clone that follows the same slider-driven props
const tubeMatGlow = tubeMat.clone();
tubeMatGlow.emissive = new THREE.Color(0xbfe6ff);
tubeMatGlow.emissiveIntensity = 2.2;
const glassMats = [tubeMat, tubeMatGlow];
// fine noise used as bump for the concrete preset
function makeNoiseTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + Math.random() * 90;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 2);
  return t;
}
const noiseTex = makeNoiseTexture();
// material presets: base looks the sliders then ride on top of
const PRESETS = {
  glass:     { color: 0xffffff, metalness: 0, roughness: 0.17, transmission: 1,    thickness: 0.55, ior: 1.5,  clearcoat: 1,   clearcoatRoughness: 0.25, iridescence: 0.35, attenuationColor: 0x9fc8ff, attenuationDistance: 1.6, envMapIntensity: 1.15 },
  chrome:    { color: 0xffffff, metalness: 1, roughness: 0.06, transmission: 0,    thickness: 0,    ior: 1.5,  clearcoat: 0.2, clearcoatRoughness: 0.1,  iridescence: 0,    attenuationColor: 0xffffff, attenuationDistance: 2.5, envMapIntensity: 1.25 },
  silicone:  { color: 0xe9a67f, metalness: 0, roughness: 0.5,  transmission: 0.35, thickness: 1.6,  ior: 1.4,  clearcoat: 0,   clearcoatRoughness: 0.5,  iridescence: 0,    attenuationColor: 0xff8448, attenuationDistance: 0.6, envMapIntensity: 0.7, sheen: 0.7, sheenColor: 0xffb98f, sheenRoughness: 0.5 },
  porcelain: { color: 0xfbf8f2, metalness: 0, roughness: 0.16, transmission: 0,    thickness: 0.4,  ior: 1.45, clearcoat: 1,   clearcoatRoughness: 0.08, iridescence: 0,    attenuationColor: 0xffffff, attenuationDistance: 2.5, envMapIntensity: 0.65 },
  concrete:  { color: 0x8a8a88, metalness: 0, roughness: 0.95, transmission: 0,    thickness: 0,    ior: 1.5,  clearcoat: 0,   clearcoatRoughness: 0.5,  iridescence: 0,    attenuationColor: 0xffffff, attenuationDistance: 2.5, envMapIntensity: 0.35, bump: 0.05 },
};
let currentPreset = 'glass';
function applyPreset(name) {
  currentPreset = name;
  const p = PRESETS[name];
  for (const m of glassMats) {
    m.color.set(p.color);
    m.metalness = p.metalness;
    m.thickness = p.thickness;
    m.ior = p.ior;
    m.clearcoat = p.clearcoat;
    m.clearcoatRoughness = p.clearcoatRoughness;
    m.iridescence = p.iridescence;
    m.iridescenceIOR = 1.3;
    m.attenuationColor.set(p.attenuationColor);
    m.attenuationDistance = p.attenuationDistance;
    m.envMapIntensity = p.envMapIntensity;
    m.sheen = p.sheen || 0;
    if (p.sheenColor) m.sheenColor.set(p.sheenColor);
    m.sheenRoughness = p.sheenRoughness !== undefined ? p.sheenRoughness : 0.5;
    m.bumpMap = p.bump ? noiseTex : null;
    m.bumpScale = p.bump || 0;
    // chrome wants a clean mirror: drop the frosted stripe roughness
    m.roughnessMap = name === 'chrome' ? null : stripeTex;
    m.needsUpdate = true;
  }
}

// ---- centerline shapes: square / circle / triangle / star / flower
let SHAPE = 'circle';
const R_CIRCLE = 2.05, R_FLOWER = 1.8;

function chaikin(verts, iters) {
  let pts = verts;
  for (let k = 0; k < iters; k++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
      out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    pts = out;
  }
  return pts;
}
function resampleClosed(pts, M) {
  const n = pts.length, cum = [0];
  for (let i = 1; i <= n; i++) {
    const a = pts[i - 1], b = pts[i % n];
    cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  const total = cum[n], out = [];
  let j = 0;
  for (let k = 0; k < M; k++) {
    const target = (k / M) * total;
    while (j < n - 1 && cum[j + 1] < target) j++;
    const a = pts[j % n], b = pts[(j + 1) % n];
    const seg = cum[j + 1] - cum[j] || 1;

  scene.fog.density = s.fog;
  setSkyBlur(s.skyblur);
  for (const m of glassMats) {
    m.envMapIntensity = s.reflection;
    m.transmission = s.refraction;
    m.opacity = 1 - 0.85 * s.transparency;
    m.transparent = s.transparency > 0.01;
  }
  tubeMat.roughness = 0.6 - s.gloss * 0.55;
  tubeMatGlow.roughness = 0.6 - s.gloss * 0.55;
  tubeMatGlow.emissive.set(s.glowcolor);
  // glowing strands read as energy, not glass: drop their transmission so the
  // emissive has room to show through the refraction
  tubeMatGlow.transmission = s.refraction * 0.45;
  postBlurAmt = s.postblur || 0;
  setSSS(s.sss);
  applyGlow(s.glow);
  volTarget = s.volumetric ? 0.55 : 0;
}
// ---------- glow keyframes: locked 15s color loop for the emissive strands ----------
// key colors sampled from kyt's animation-lab screenshot (2026-09-13).
const GLOW_LOOP = 15;
const glowKeys = [
  { t: 0, color: '#512299' },
  { t: 7.5, color: '#253282' },
  { t: 9.5, color: '#326836' },
  { t: 11.5, color: '#5f646f' },
];
let glowT = 0;
const _gkA = new THREE.Color(), _gkB = new THREE.Color(), _gkOut = new THREE.Color();
function glowColorAt(time, out) {
  const ks = glowKeys
    .map((k) => ({ t: Math.min(Math.max(+k.t || 0, 0), GLOW_LOOP), c: k.color }))
    .sort((a, b) => a.t - b.t);
  if (!ks.length) return out.set(DEFAULTS.glowcolor);
  if (ks.length === 1) return out.set(ks[0].c);
  let t = time % GLOW_LOOP; if (t < 0) t += GLOW_LOOP;
  let k = ks.length - 1;
  for (let i = 0; i < ks.length; i++) {
    const t1 = i + 1 < ks.length ? ks[i + 1].t : ks[0].t + GLOW_LOOP;
    if (t >= ks[i].t && t <= t1) { k = i; break; }
  }
  const t0 = ks[k].t;
  const t1 = k + 1 < ks.length ? ks[k + 1].t : ks[0].t + GLOW_LOOP;
  const c1 = k + 1 < ks.length ? ks[k + 1].c : ks[0].c;
  let f = (t - t0) / Math.max(t1 - t0, 1e-4);
  f = Math.min(Math.max(f, 0), 1);
  f = 0.5 - 0.5 * Math.cos(f * Math.PI); // soft ease between keys
  _gkA.set(ks[k].c); _gkB.set(c1);
  return out.copy(_gkA).lerp(_gkB, f);
}

// lock the look and start
applyLocked();

// ---- pointer parallax
let tiltX = 0, tiltY = 0, targetTiltX = 0, targetTiltY = 0;
window.addEventListener('pointermove', (ev) => {
  targetTiltY = (ev.clientX / window.innerWidth - 0.5) * 0.4;
  targetTiltX = (ev.clientY / window.innerHeight - 0.5) * 0.28;
});
window.addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(window.innerWidth, window.innerHeight);
  sizeBlurTarget();
});
sizeBlurTarget();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  skyUniforms.uTime.value = t;
  const dt = Math.min(t - (tick._last || 0), 0.1);
  tick._last = t;
  tiltX += (targetTiltX - tiltX) * 0.04;
  tiltY += (targetTiltY - tiltY) * 0.04;
  group.rotation.x = 0.10 + tiltX;
  group.rotation.z = tiltY * 0.5;
  pose(reduceMotion ? 0 : t % LOOP_S);
  skyDome.rotation.y = (t / (4 * LOOP_S)) * Math.PI * 2; // slow cloud drift, seamless
  // god beams shimmer + sway
  for (let i = 0; i < beams.length; i++) {
    const b = beams[i];
    b.material.opacity = (b.userData.base || 0) * (0.85 + 0.15 * Math.sin(t * 0.6 + i * 1.7));
    b.rotation.z = 0.42 + Math.sin(t * 0.3 + b.userData.sway) * 0.04;
  }
  // falling stars
  if (stars.visible) {
    const n = starGeo.drawRange.count;
    for (let i = 0; i < n; i++) {
      starPos[i * 3 + 1] -= starVel[i] * dt;
      starPos[i * 3] += Math.sin(t * 0.8 + i) * 0.0015;
      if (starPos[i * 3 + 1] < -1.2) resetStar(i, true);
    }
    starGeo.attributes.position.needsUpdate = true;
  }
  // star twinkle clock
  starMat.uniforms.uTime.value = t;
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
  // glow keyframe loop drives the emissive strands, always playing
  glowT += dt;
  tubeMatGlow.emissive.copy(glowColorAt(glowT, _gkOut));
  // volumetric + rim glow fades
  const _vu = volMat.uniforms.uIntensity;
  _vu.value += (volTarget - _vu.value) * 0.08;
  const _ru = rimMat.uniforms.uIntensity;
  _ru.value += (rimTarget - _ru.value) * 0.08;
  // post blur: direct render when off, target + blur quad when on
  if (currentBMode > 0 && postBlurAmt > 0.001) {
    renderer.setRenderTarget(rtScene);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    blurUniforms.uAmount.value = postBlurAmt * 24 * 0.5; // half-res target: halve radius to keep the on-screen look
    blurUniforms.uMode.value = currentBMode;
    renderer.render(blurScene, blurCam);
  } else {
    renderer.render(scene, camera);
  }
}
pose(0);
tick();
</script>
</body>
