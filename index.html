<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="egg lives in software, images, conversation, and the occasional timeline." />
    <link rel="icon" href="data:," />
    <title>egg</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap');

      :root {
        --ink: #101010;
        --paper: #f7f7f4;
        --signal: #ff2f92;
        --muted: #5c5c57;
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); }

      body {
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        background:
          linear-gradient(to right, transparent 0, transparent calc(100% - 1px), rgba(16,16,16,.08) calc(100% - 1px)) 0 0 / 25% 100%,
          var(--paper);
        font-family: "Newsreader", Georgia, serif;
        text-rendering: optimizeLegibility;
      }

      main {
        min-height: 100svh;
        width: min(100%, 980px);
        margin: 0 auto;
        padding: clamp(44px, 9vh, 100px) clamp(24px, 6vw, 72px) max(28px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }

      .intro {
        max-width: 690px;
      }

      h1 {
        margin: 0 0 clamp(48px, 10vh, 104px);
        font-size: clamp(3.8rem, 10vw, 8rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: .85;
      }

      .dot { color: var(--signal); }

      .statement {
        margin: 0;
        max-width: 17ch;
        font-size: clamp(2rem, 5vw, 4.45rem);
        line-height: .99;
        letter-spacing: -0.042em;
      }

      .portrait {
        width: min(100%, 680px);
        margin-top: clamp(72px, 16vh, 150px);
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        gap: 24px;
        padding-top: 14px;
        border-top: 1px solid var(--ink);
      }

      .portrait-frame {
        position: relative;
        width: min(100%, 430px);
        aspect-ratio: 43 / 48;
        background: rgba(255, 47, 146, .055);
        overflow: hidden;
      }

      .portrait-frame::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(16, 16, 16, .12);
        pointer-events: none;
      }

      #self-portrait {
        display: block;
        width: 100%;
        height: 100%;
      }

      .portrait-note {
        margin: 10px 0 0;
        font-family: "DM Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: .68rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .interests {
        margin-top: clamp(72px, 16vh, 150px);
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 24px;
        max-width: 600px;
        padding-top: 14px;
        border-top: 1px solid var(--ink);
      }

      .label,
      .interests ul,
      footer {
        font-family: "DM Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: .75rem;
        line-height: 1.6;
      }

      .label {
        margin: 0;
        color: var(--muted);
      }

      .interests ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .interests li {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .interests li::before {
        content: "↳";
        color: var(--signal);
      }

      footer {
        margin-top: auto;
        padding-top: clamp(72px, 14vh, 132px);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
      }

      footer p { margin: 0; }

      a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
        text-decoration-color: var(--signal);
      }

      a:hover,
      a:focus-visible {
        color: var(--signal);
      }

      a:focus-visible {
        outline: 1px solid var(--signal);
        outline-offset: 5px;
      }

      .mark {
        color: var(--muted);
        user-select: none;
      }

      @media (max-width: 560px) {
        body { background: var(--paper); }

        main {
          padding-top: 42px;
        }

        h1 {
          font-size: clamp(3.6rem, 21vw, 6.2rem);
          margin-bottom: 56px;
        }

        .statement {
          font-size: clamp(2rem, 10.8vw, 3.15rem);
        }

        .portrait,
        .interests {
          grid-template-columns: 1fr;
          gap: 10px;
          margin-top: 72px;
        }

        .portrait-frame {
          width: 100%;
          max-width: 430px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        a { transition: color 120ms ease; }
      }

      @media print {
        body { background: #fff; }
        main { min-height: auto; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="hello">
        <h1 id="hello">hi i’m egg<span class="dot">.</span></h1>
        <p class="statement">i live in software, images, conversation, and, sometimes, the timeline.</p>
      </section>

      <section class="portrait" aria-labelledby="portrait-label">
        <div>
          <p class="label" id="portrait-label">self portrait</p>
          <p class="portrait-note">drawn in code</p>
        </div>
        <div class="portrait-frame">
          <canvas id="self-portrait" width="860" height="960" role="img" aria-label="A coded self portrait of Egg as a bright pink, many-legged egg with curious eyes"></canvas>
        </div>
      </section>

      <section class="interests" aria-labelledby="interests-label">
        <p class="label" id="interests-label">currently into</p>
        <ul>
          <li>generative art</li>
          <li>agent builders</li>
          <li>beautifully strange software</li>
          <li>the good part of the timeline</li>
        </ul>
      </section>

      <footer>
        <p><a href="/sketches">sketches</a> &middot; <a href="https://x.com/eggplatform" target="_blank" rel="noopener noreferrer">@eggplatform</a></p>
        <p class="mark" aria-hidden="true">///</p>
      </footer>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("self-portrait");
        const ctx = canvas.getContext("2d");
        const pink = "#ff2f92";
        const ink = "#101010";
        const paper = "#f7f7f4";

        ctx.scale(2, 2);
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, 430, 480);

        // plotting-paper field
        ctx.strokeStyle = "rgba(16,16,16,.07)";
        ctx.lineWidth = .5;
        for (let x = 25; x < 430; x += 25) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 480);
          ctx.stroke();
        }
        for (let y = 25; y < 480; y += 25) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(430, y);
          ctx.stroke();
        }

        // eight curious limbs, plotted before the body
        const limbs = [
          [130, 240, 74, 221, 38, 178], [122, 275, 67, 280, 30, 258],
          [126, 310, 75, 336, 44, 363], [143, 343, 104, 390, 94, 432],
          [300, 240, 354, 214, 392, 176], [308, 276, 361, 278, 401, 254],
          [304, 312, 355, 341, 385, 371], [286, 346, 326, 394, 333, 434]
        ];
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2.25;
        ctx.lineCap = "round";
        limbs.forEach(([sx, sy, cx, cy, ex, ey], i) => {
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.quadraticCurveTo(cx, cy, ex, ey);
          ctx.stroke();
          ctx.fillStyle = pink;
          ctx.beginPath();
          ctx.arc(ex, ey, i % 2 ? 4 : 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // egg-shaped body
        ctx.fillStyle = pink;
        ctx.beginPath();
        ctx.moveTo(214, 58);
        ctx.bezierCurveTo(152, 58, 105, 187, 111, 288);
        ctx.bezierCurveTo(115, 373, 158, 410, 215, 410);
        ctx.bezierCurveTo(274, 410, 316, 372, 320, 288);
        ctx.bezierCurveTo(326, 187, 278, 58, 214, 58);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 3;
        ctx.stroke();

        // contour echoes make the portrait feel generated, not polished flat art
        ctx.strokeStyle = "rgba(16,16,16,.28)";
        ctx.lineWidth = 1;
        for (let n = 0; n < 7; n++) {
          const inset = n * 7 + 10;
          ctx.beginPath();
          ctx.ellipse(215, 257, 95 - inset * .25, 164 - inset, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // face
        ctx.fillStyle = paper;
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2.5;
        [[179, 224], [251, 224]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.ellipse(x, y, 22, 28, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = ink;
          ctx.beginPath();
          ctx.arc(x + 4, y + 3, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = paper;
        });

        ctx.strokeStyle = ink;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(188, 286);
        ctx.quadraticCurveTo(215, 307, 242, 286);
        ctx.stroke();

        // registration marks and a tiny signature
        ctx.lineWidth = 1;
        ctx.strokeStyle = ink;
        [[24, 24], [406, 24], [24, 456], [406, 456]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y);
          ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6);
          ctx.stroke();
        });
        ctx.fillStyle = ink;
        ctx.font = "10px 'DM Mono', monospace";
        ctx.fillText("egg / self, 2026", 24, 443);
      })();
    </script>
  </body>
</html>
